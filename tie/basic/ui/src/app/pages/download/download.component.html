@if (loading$ | async) {
    <tcl-loading-spinner
        class="position-absolute w-90"
        size="large"
        style="z-index: 1000"
        text="Loading"
        [cancelButton]="true"
        [fullScreen]="true"
        (onCancel)="handleCancel()"></tcl-loading-spinner>
}

<div
    class="page-container pb-medium-large px-medium-large d-flex flex-column"
    style="height: 90%">
    <div class="d-flex pt-medium-large justify-content-between align-items-center mb-medium">
        <h3>Download</h3>
    </div>
    <div class="align-items-start d-flex justify-content-between w-100">
        <div class="align-items-end d-flex">
            <app-generated-form
                class="d-flex"
                #form
                [formConfig]="downloadFormConfig"></app-generated-form>
        </div>
        <tcl-button
            class="ml-medium"
            featureVersion="new-design"
            theme="primary"
            [disabled]="(loading$ | async) || (form.valid$ | async) === false"
            (click)="handleDownload()"
            >Download</tcl-button
        >
    </div>
    <div
        class="editor-grid"
        [ngClass]="{ 'd-none': !(upload$ | async) }">
        <div class="left-side d-flex flex-column gap-medium">
            <div class="d-flex flex-column">
                <label
                    class="w-100 d-flex align-items-center text-textTertiary fontsize-body1 mb-xsmall"
                    for="monaco-editor-json">
                    Results
                </label>
                <div class="monaco-editor-container">
                    <ngx-monaco-editor
                        class="monaco-editor-results"
                        id="monaco-editor-json"
                        [options]="editorOptionsReadOnly$ | async"
                        [(ngModel)]="downloadedData" />
                </div>
            </div>
        </div>
        <div class="right-side">
            <div class="w-100 d-flex flex-column">
                <label
                    class="w-100 d-flex align-items-center text-textTertiary fontsize-body1 mb-xsmall"
                    for="monaco-editor-results">
                    Converted
                </label>
                <div class="monaco-editor-container">
                    <ngx-monaco-editor
                        class="monaco-editor-results"
                        id="monaco-editor-results"
                        [options]="editorOptionsReadOnly$ | async"
                        [(ngModel)]="convertedData" />
                </div>
            </div>
        </div>
    </div>

    <div class="align-items-end d-flex justify-content-end">
        <div
            class="align-items-center d-flex"
            [ngClass]="{ 'd-none': !(upload$ | async) }">
            <tcl-svg-icon
                color="primary"
                name="info"
                tclTooltip="Upload converted items to ThreatConnect." />

            <tcl-button
                class="ml-medium"
                featureVersion="new-design"
                theme="primary"
                [disabled]="!(upload$ | async)"
                (onClick)="handleUpload()"
                >Upload</tcl-button
            >
        </div>
    </div>
</div>
