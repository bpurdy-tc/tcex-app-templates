repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-builtin-literals
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: check-toml
      - id: debug-statements
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --autofix
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        exclude: |
          (?x)(
              tests/
          )
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --ignore=D104,D202,D203,D213,D300,D301,D400,D402,D406,D407,D413,D415
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus
  - repo: https://github.com/yunojuno/pre-commit-xenon
    rev: v0.1
    hooks:
      - id: xenon
        args: ['--max-average=B', '-e=tests*']
  - repo: local
    hooks:
      - id: update-manifest-after-template-change
        name: Update manifest after template change
        language: python
        entry: python scripts/update_manifest_post_commit.py
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        additional_dependencies:
          - pyyaml>=6.0
      - id: pylint
        entry: pylint
        language: system
        name: pylint
        types: [python]
        args: ['--jobs=3']
